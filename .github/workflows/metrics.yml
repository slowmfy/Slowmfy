name: Profil - statistiques

on:
  schedule:
    - cron: "17 3 * * *"   # tous les jours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contributions.svg?color_snake=#2563eb&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/contributions-dark.svg?palette=github-dark&color_snake=#3b82f6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Mise à jour de la grille de contributions"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Vue d'ensemble
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/overview.svg
          base: header, activity, community, repositories
          config_timezone: Europe/Paris
          config_display: large
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8

      - name: Calendrier 3D
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: Europe/Paris
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
